[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specmc"
version = "0.2.0"
description = "Spectral Mantle Convection: a self-contained spectral Galerkin solver for 2-D variable-viscosity mantle convection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zehua Song" }]
keywords = [
    "mantle convection",
    "spectral methods",
    "Stokes flow",
    "variable viscosity",
    "geodynamics",
    "Rayleigh-Benard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
# The package imports only intra-package plus numpy/scipy.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["specmc*"]
